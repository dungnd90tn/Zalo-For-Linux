[package]
name = "zalo-linux-native-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Independent native Linux chat migration prototype"
default-run = "zalo-rust"
autobins = false

[lib]
name = "zalo_rust"
path = "src/lib.rs"

[[bin]]
name = "zalo-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
fs2 = "0.4"
libc = "0.2"
rand = "0.8"
lru = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
md-5 = "0.10"
url = "2"
bytes = { version = "1", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["cookies", "rustls-tls"] }
wasmi = { version = "=2.0.0", optional = true, default-features = false, features = ["std", "validate", "auto-dispatch"] }

rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[features]
default = []
trust-wasm = ["dep:wasmi"]
network = ["dep:reqwest", "dep:bytes"]

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
