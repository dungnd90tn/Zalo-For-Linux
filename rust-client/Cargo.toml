[package]
name = "zalo-linux-native-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Independent native Linux chat migration prototype"
default-run = "zalo-rust"
autobins = false

[lib]
name = "zalo_rust"
path = "src/lib.rs"

[[bin]]
name = "zalo-rust"
path = "src/main.rs"

[dependencies]
libsignal-core = { git = "https://github.com/signalapp/libsignal", rev = "904c8dc8216073b078a5f2f5090e3da8382e6a92", optional = true }
zalo-signal-engine = { path = "crates/zalo-signal-engine", optional = true, default-features = false }
anyhow = "1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
fs2 = "0.4"
libc = "0.2"
rand = "0.8"
lru = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
md-5 = "0.10"
url = "2"
bytes = { version = "1", optional = true }
aes-gcm = { version = "0.10", optional = true }
flate2 = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.24", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
percent-encoding = { version = "2", optional = true }
qrcode = { version = "0.14", optional = true, default-features = false }
png = { version = "0.18", optional = true }
jxl-bitstream = { version = "=1.1.0", optional = true }
jxl-oxide-common = { version = "=1.0.0", optional = true }
jxl-oxide = { version = "=0.12.6", optional = true, default-features = false }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["cookies", "rustls-tls"] }
wasmi = { version = "=2.0.0", optional = true, default-features = false, features = ["std", "validate", "auto-dispatch"] }

rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }

[features]
default = []
signal-store = ["dep:zalo-signal-engine"]
signal-crypto = ["signal-store", "messaging", "zalo-signal-engine/embedded", "dep:libsignal-core"]
trust-wasm = ["dep:wasmi"]
network = ["dep:reqwest", "dep:bytes"]
live-login = ["network", "trust-wasm", "dep:qrcode", "dep:png"]
messaging = ["live-login", "dep:aes-gcm", "dep:flate2", "dep:futures-util", "dep:tokio-tungstenite", "dep:percent-encoding", "dep:image", "dep:jxl-oxide", "dep:jxl-bitstream", "dep:jxl-oxide-common"]
live = ["messaging"]

[target.'cfg(target_os = "linux")'.dependencies]
# eframe disables winit defaults; restore Adwaita CSD for Wayland compositors
# without server decorations while retaining the compositor's decoration policy.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[dev-dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Preserve Linux XIM/Wayland composition with the pinned egui 0.29 input adapter.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
