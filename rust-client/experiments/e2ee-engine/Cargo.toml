[package]
name = "zalo-e2ee-engine-experiment"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc"] }
hmac = "=0.12.1"
sha2 = "=0.10.9"
getrandom = "=0.2.17"
serde_json = "1"
libsignal-core = { git = "https://github.com/signalapp/libsignal", rev = "904c8dc8216073b078a5f2f5090e3da8382e6a92", optional = true }
rand = { version = "0.9", optional = true }

[features]
default = []
native-curve = ["dep:libsignal-core", "dep:rand"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
