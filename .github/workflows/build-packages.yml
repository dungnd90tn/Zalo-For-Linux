name: Build packages

# Builds the installable .deb and .rpm of the native Rust client and attaches them to the release.
# This replaces the former Electron AppImage build: nothing in CI compiles or packages Electron now.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package_release:
        description: 'Package release number (the "-N" after the version); raise it for a rebuild of the same version'
        default: '1'
        required: true

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to commit SHAs, not floating tags: a mutable tag like @v4 can be
      # repointed at new code by whoever controls the action repo, which would run in this
      # release job. The trailing comment records which release each SHA is.
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the release tag matches the crate version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' rust-client/Cargo.toml | head -1)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag '$TAG' does not match rust-client/Cargo.toml version '$version'." >&2
            echo "Bump the version, or tag the release v$version." >&2
            exit 1
          fi

      # Compiles in a pinned Ubuntu 20.04 container so the binary needs only glibc 2.31, then
      # builds the .deb there and the .rpm in a pinned Fedora container. Docker is preinstalled.
      - name: Build .deb and .rpm
        env:
          ZALO_PKG_RELEASE: ${{ github.event.inputs.package_release || '1' }}
        run: ./scripts/rust/package.sh

      - name: Install the packages with apt and dnf in clean containers
        run: ./scripts/rust/package/verify.sh

      - name: Keep the packages as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zalo-native-packages
          path: |
            dist/rust/*.deb
            dist/rust/*.rpm
            dist/rust/SHA256SUMS
          if-no-files-found: error

      - name: Attach the packages to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/rust/*.deb
            dist/rust/*.rpm
            dist/rust/SHA256SUMS
